<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients for anatomical shading -->
    <linearGradient id="myocardiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E15554"/>
      <stop offset="70%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#922B21"/>
    </linearGradient>
    <linearGradient id="aortaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="pulmonaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="60%" stop-color="#2E86C1"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
    <linearGradient id="cavaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#85C1E9"/>
      <stop offset="100%" stop-color="#2874A6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title / Figure Header -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Anterior View of the Heart</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#64748B">Figure 19.4 • OpenStax Anatomy &amp; Physiology 2e • CC BY 4.0</text>
  
  <!-- Orientation Indicators -->
  <rect x="50" y="80" width="130" height="26" rx="4" fill="#F1F5F9"/>
  <text x="115" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Viewer's Left (Right Heart)</text>
  
  <rect x="620" y="80" width="130" height="26" rx="4" fill="#F1F5F9"/>
  <text x="685" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Viewer's Right (Left Heart)</text>

  <!-- Superior Vena Cava (SVC) -->
  <path d="M 270 120 L 270 270 Q 270 300 290 320 L 320 320 L 320 120 Z" fill="url(#cavaGrad)" stroke="#1B4F72" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Inferior Vena Cava (IVC) at base -->
  <path d="M 280 570 L 280 640 L 325 640 L 325 570 Z" fill="url(#cavaGrad)" stroke="#1B4F72" stroke-width="2"/>

  <!-- Ascending Aorta and Arch (arches over pulmonary arteries) -->
  <path d="M 360 320 Q 360 210 400 170 Q 450 140 500 180 Q 520 200 520 280 L 485 280 Q 480 220 460 195 Q 430 175 400 210 Q 395 240 395 320 Z" 
        fill="url(#aortaGrad)" stroke="#922B21" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Aortic Arch Branches (3 distinct vessels) -->
  <!-- 1. Brachiocephalic trunk -->
  <path d="M 405 185 L 390 110 L 415 110 L 425 178 Z" fill="url(#aortaGrad)" stroke="#922B21" stroke-width="2"/>
  <!-- 2. Left Common Carotid -->
  <path d="M 440 175 L 442 110 L 464 110 L 458 175 Z" fill="url(#aortaGrad)" stroke="#922B21" stroke-width="2"/>
  <!-- 3. Left Subclavian -->
  <path d="M 475 182 L 490 110 L 512 110 L 495 192 Z" fill="url(#aortaGrad)" stroke="#922B21" stroke-width="2"/>

  <!-- Left Pulmonary Artery and Right Pulmonary Artery branches -->
  <path d="M 320 250 L 250 240 L 250 268 L 320 275 Z" fill="url(#pulmonaryGrad)" stroke="#1B4F72" stroke-width="1.5"/>
  <path d="M 470 260 L 550 255 L 550 285 L 470 285 Z" fill="url(#pulmonaryGrad)" stroke="#1B4F72" stroke-width="1.5"/>

  <!-- Pulmonary Trunk (Crosses ANTERIOR to Ascending Aorta) -->
  <path d="M 360 380 Q 375 310 420 265 Q 460 250 490 265 L 475 300 Q 440 285 410 320 Q 395 350 390 380 Z" 
        fill="url(#pulmonaryGrad)" stroke="#154360" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Right Atrium & Auricle -->
  <path d="M 285 280 C 230 320 220 400 240 480 C 255 530 285 570 310 570 C 320 540 330 450 330 400 C 330 350 340 330 360 325 C 330 320 300 300 285 280 Z" 
        fill="#D98880" stroke="#922B21" stroke-width="2" filter="url(#shadow)"/>
  <!-- Right Auricle flap wrapping over aortic base -->
  <path d="M 330 325 C 350 320 375 330 380 345 C 360 360 335 355 330 325 Z" fill="#CD6155" stroke="#922B21" stroke-width="1.5"/>

  <!-- Left Auricle -->
  <path d="M 485 300 C 515 310 540 340 535 375 C 510 370 490 350 480 330 Z" 
        fill="#CD6155" stroke="#922B21" stroke-width="1.8"/>

  <!-- Ventricles Body (Myocardium Mass) -->
  <!-- Left Ventricle (forms apex inferolaterally pointing to viewer's right) -->
  <path d="M 440 380 C 530 410 570 480 540 570 C 515 640 480 670 450 675 C 430 670 415 620 405 570 Z" 
        fill="#B03A2E" stroke="#78281F" stroke-width="2" filter="url(#shadow)"/>

  <!-- Right Ventricle (occupies dominant anterior surface) -->
  <path d="M 310 550 C 330 460 350 400 365 380 C 400 380 435 385 440 400 C 420 460 400 560 450 675 C 370 665 320 620 310 550 Z" 
        fill="#C0392B" stroke="#78281F" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Anterior Interventricular Sulcus / Groove (with LAD coronary artery) -->
  <path d="M 425 385 Q 400 480 415 570 Q 425 620 445 670" 
        fill="none" stroke="#F1C40F" stroke-width="4" stroke-dasharray="8 4"/>
  <path d="M 425 385 Q 400 480 415 570 Q 425 620 445 670" 
        fill="none" stroke="#E74C3C" stroke-width="2"/>

  <!-- Apex marker -->
  <circle cx="452" cy="675" r="5" fill="#E74C3C" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Callout Lines and Labels -->
  <!-- 1. Superior Vena Cava -->
  <line x1="270" y1="180" x2="160" y2="180" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="270" cy="180" r="3" fill="#0F766E"/>
  <text x="150" y="184" text-anchor="end" font-size="13" font-weight="600" fill="#0F766E">Superior Vena Cava</text>

  <!-- 2. Ascending Aorta & Arch -->
  <line x1="430" y1="155" x2="430" y2="90" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="430" cy="155" r="3" fill="#0F766E"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#0F766E">Aortic Arch</text>

  <!-- 3. Great Arch Branches -->
  <line x1="400" y1="120" x2="270" y2="120" stroke="#0F766E" stroke-width="1"/>
  <text x="260" y="124" text-anchor="end" font-size="11" fill="#334155">Brachiocephalic Trunk</text>

  <!-- 4. Pulmonary Trunk -->
  <line x1="420" y1="310" x2="620" y2="230" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="420" cy="310" r="3" fill="#0F766E"/>
  <text x="630" y="234" text-anchor="start" font-size="13" font-weight="600" fill="#0F766E">Pulmonary Trunk (Anterior)</text>

  <!-- 5. Right Atrium & Auricle -->
  <line x1="250" y1="400" x2="160" y2="400" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="250" cy="400" r="3" fill="#0F766E"/>
  <text x="150" y="404" text-anchor="end" font-size="13" font-weight="600" fill="#0F766E">Right Atrium</text>

  <!-- 6. Right Ventricle -->
  <line x1="360" y1="480" x2="160" y2="480" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="360" cy="480" r="3" fill="#0F766E"/>
  <text x="150" y="484" text-anchor="end" font-size="13" font-weight="600" fill="#0F766E">Right Ventricle (Anterior Bulk)</text>

  <!-- 7. Left Auricle -->
  <line x1="510" y1="340" x2="620" y2="340" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="510" cy="340" r="3" fill="#0F766E"/>
  <text x="630" y="344" text-anchor="start" font-size="13" font-weight="600" fill="#0F766E">Left Auricle</text>

  <!-- 8. Anterior Interventricular Sulcus -->
  <line x1="415" y1="530" x2="620" y2="480" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="415" cy="530" r="3" fill="#0F766E"/>
  <text x="630" y="484" text-anchor="start" font-size="13" font-weight="600" fill="#0F766E">Anterior Interventricular Sulcus</text>

  <!-- 9. Left Ventricle & Apex -->
  <line x1="490" y1="560" x2="620" y2="560" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="490" cy="560" r="3" fill="#0F766E"/>
  <text x="630" y="564" text-anchor="start" font-size="13" font-weight="600" fill="#0F766E">Left Ventricle</text>

  <line x1="452" y1="675" x2="620" y2="675" stroke="#0F766E" stroke-width="1.5"/>
  <text x="630" y="679" text-anchor="start" font-size="13" font-weight="600" fill="#0F766E">Apex (points to patient's left)</text>

  <!-- Attribution Box -->
  <rect x="180" y="730" width="440" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="400" y="752" text-anchor="middle" font-size="11.5" fill="#475569">
    Reference: Figure 19.4, Anatomy and Physiology 2e, OpenStax, CC BY 4.0
  </text>
</svg>
